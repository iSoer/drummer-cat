<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F1A17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Drummer Cat</title>
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
  </head>
  <body>
    <div id="app" class="app">
      <div id="sprites" class="sprites" aria-hidden="true"></div>
      <header class="hud" id="hud">
        <div class="hud__row">
          <div class="portrait" id="portrait"></div>
          <div class="counter">
            <span class="counter__label">Уронено</span>
            <span class="counter__value" id="counter">0</span>
          </div>
          <button class="hud__btn" id="btn-skins" type="button" aria-label="Скины">🎨</button>
          <button class="hud__btn" id="btn-settings" type="button" aria-label="Настройки">⚙️</button>
        </div>
        <div class="fury">
          <div class="fury__track"><div class="fury__bar" id="fury-bar"></div></div>
          <span class="fury__label" id="fury-label">Спокоен</span>
        </div>
      </header>
      <main class="stage" id="stage"></main>
      <div class="sheet-root" id="sheet-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
